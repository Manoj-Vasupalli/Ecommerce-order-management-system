server:
  port: 8080
spring:
  application:
    name: ecommerce-api-gateway
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Correlation-Id, #{T(java.util.UUID).randomUUID().toString()}
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/products/**
        - id: cart-service
          uri: http://localhost:8082
          predicates:
            - Path=/cart/**
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/inventory/**
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/orders/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/payments/**
        - id: shipping-service
          uri: http://localhost:8086
          predicates:
            - Path=/shipments/**
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/notifications/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics